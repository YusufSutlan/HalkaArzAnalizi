name: İzahname Finansal Veri Çıkarımı

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'İşlenecek şirket sayısı'
        required: false
        default: '1'
        type: string

jobs:
  finansal_okuma:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber beautifulsoup4 curl_cffi Pillow

      - name: İzahnameleri İşle (AI Hattı)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python Izahnameisle.py --limit ${{ github.event.inputs.limit }}

      - name: Üretilen JSON'ları Depoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Finansal veriler güncellendi" && git push)